<style>

  .stat { text-align:center; } .stat-val { font-size:1.3rem; font-weight:700; color:#00d4ff; } .stat-label { font-size:0.7rem; color:var(--muted); text-transform:uppercase; }
  .stage { max-width:520px; margin:0 auto; padding:0 0.9rem 3rem; position:relative; z-index:10; }
  .panel { display:none; } .panel.active { display:block; }
  .card-container { perspective:1000px; height:300px; margin-bottom:1rem; }

  .btn.primary { background:linear-gradient(135deg,#ff4d6d,#7b2cbf); border:none; }
  .card-nav, .controls { display:flex; justify-content:center; gap:0.6rem; flex-wrap:wrap; margin-top:0.8rem; }
  .quiz-question { background:#1a1a2e; border:1px solid var(--border); border-radius:18px; padding:2rem 1.2rem; text-align:center; margin-bottom:1rem; }

  .options { display:grid; gap:0.6rem; }
  .option { background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:0.95rem 1.1rem; font-size:0.95rem; cursor:pointer; text-align:left; color:var(--text); min-height:50px; display:flex; align-items:center; }

  .type-question { background:#1a1a2e; border:1px solid var(--border); border-radius:18px; padding:2rem 1.2rem; text-align:center; margin-bottom:1rem; }

  .type-meaning { font-size:1.05rem; color:var(--muted); margin-top:0.6rem; }

  <canvas id="fw-canvas"></canvas>

    </div>
    <div class="panel" id="panel-quiz">

        <button class="btn" id="quiz-shuffle">🔀 Xáo</button>
      </div>
    </div>

        <div class="type-meaning" id="type-meaning"></div>

        <button class="tone-btn" data-tone="3">ǎ</button>
        <button class="tone-btn" data-tone="4">à</button>
        <button class="tone-btn" data-tone="0">a</button>

      <div class="feedback" id="type-feedback"></div>
      <div class="progress-bar"><div class="progress-fill" id="type-progress" style="width:0%"></div></div>
      <div class="controls">

        <button class="btn" id="type-skip">Bỏ qua</button>
        <button class="btn" id="type-shuffle">🔀 Xáo</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

// ===== STATE =====
let mode = 'flash';
let order = [];
let idx = 0;
let done = 0, correct = 0;
let answered = false;
let consecutiveCorrect = 0;

// ===== AUDIO =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration, vol = 0.12) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playCorrect() {
  playTone(880, 'sine', 0.1);
  setTimeout(() => playTone(1175, 'sine', 0.15), 70);
}
function playWrong() {
  playTone(200, 'sawtooth', 0.2, 0.08);
}

// ===== FIREWORKS =====
const canvas = document.getElementById('fw-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let rockets = [];
let fwRunning = false;
const colors = ['#ff4d6d','#00d4ff','#7b2cbf','#00e676','#ffd700','#ff6b35','#a855f7'];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y; this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.life = 45 + Math.random() * 30;
    this.size = 1.8 + Math.random() * 2.2;
    this.gravity = 0.09;
    this.friction = 0.96;
  }
  update() {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 1 / this.life;
    this.life--;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
  isDead() { return this.life <= 0 || this.alpha <= 0; }
}

class Rocket {
  constructor() {
    this.x = Math.random() * canvas.width * 0.7 + canvas.width * 0.15;
    this.y = canvas.height;
    this.targetY = 80 + Math.random() * canvas.height * 0.4;
    this.speed = 7 + Math.random() * 3;
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.trail = [];
  }
  update() {
    this.y -= this.speed;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 10) this.trail.shift();
    if (this.y <= this.targetY) {
      const base = this.color;
      for (let i = 0; i < 70; i++) {
        const c = Math.random() > 0.25 ? base : colors[Math.floor(Math.random()*colors.length)];
        particles.push(new Particle(this.x, this.y, c));
      }
      return true;
    }
    return false;
  }
  draw() {
    this.trail.forEach((p, i) => {
      ctx.globalAlpha = (i / this.trail.length) * 0.5;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.8, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
}

function triggerFireworks() {
  canvas.classList.add('active');
  for (let i = 0; i < 4; i++) {
    setTimeout(() => rockets.push(new Rocket()), i * 200);
  }
  if (!fwRunning) {
    fwRunning = true;
    animateFW();
  }
  setTimeout(() => {
    if (particles.length === 0 && rockets.length === 0) {
      canvas.classList.remove('active');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fwRunning = false;
    }
  }, 3500);
}

function animateFW() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = rockets.length - 1; i >= 0; i--) {
    rockets[i].draw();
    if (rockets[i].update()) rockets.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].isDead()) particles.splice(i, 1);
  }
  if (particles.length > 0 || rockets.length > 0) {
    requestAnimationFrame(animateFW);
  } else {
    canvas.classList.remove('active');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    fwRunning = false;
  }
}

// ===== UTILS =====
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function resetOrder() {
  order = shuffle([...Array(VOCAB.length).keys()]);
  idx = 0;
  answered = false;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function updateStats() {
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-acc').textContent = done ? Math.round(correct/done*100) + '%' : '—';
}
function updateProgress(id) {
  document.getElementById(id).style.width = ((idx+1)/order.length*100).toFixed(1) + '%';
}
function normalizePinyin(s) {
  return s.toLowerCase()
    .replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e')
    .replace(/[īíǐì]/g,'i').replace(/[ōóǒò]/g,'o')
    .replace(/[ūúǔù]/g,'u').replace(/[ǖǘǚǜü]/g,'v')
    .replace(/[1-5]/g,'').replace(/\s+/g,'').trim();
}
function checkAndCelebrate(isCorrect) {
  if (isCorrect) {
    consecutiveCorrect++;
    if (consecutiveCorrect % 5 === 0) {
      triggerFireworks();
      toast('🎉 Đúng ' + consecutiveCorrect + ' câu liên tiếp!');
    }
  } else {
    consecutiveCorrect = 0;
  }
}

// ===== FLASH =====
function renderFlash() {
  const w = VOCAB[order[idx]];
  document.getElementById('flash-card').classList.remove('flipped');
  document.getElementById('flash-hanzi').textContent = w.h;
  document.getElementById('flash-pinyin').textContent = w.p;
  document.getElementById('flash-meaning').textContent = w.m;
  updateProgress('flash-progress');
}
document.getElementById('flash-card').onclick = () => {
  document.getElementById('flash-card').classList.toggle('flipped');
};
document.getElementById('flash-next').onclick = () => {
  idx = (idx + 1) % order.length;
  if (idx === 0) toast('Đã hết vòng!');
  done++; updateStats(); renderFlash();
};
document.getElementById('flash-prev').onclick = () => {
  idx = (idx - 1 + order.length) % order.length;
  renderFlash();
};
document.getElementById('flash-shuffle').onclick = () => {
  resetOrder(); renderFlash(); toast('Đã xáo trộn!');
};

// ===== QUIZ =====
function renderQuiz() {
  answered = false;
  const w = VOCAB[order[idx]];
  document.getElementById('quiz-hanzi').textContent = w.h;
  document.getElementById('quiz-hint').textContent = '';
  document.getElementById('quiz-hint').classList.remove('show');
  document.getElementById('quiz-next').style.display = 'none';
  let opts = [w.m];
  while (opts.length < 4) {
    const r = VOCAB[Math.floor(Math.random()*VOCAB.length)].m;
    if (!opts.includes(r)) opts.push(r);
  }
  opts = shuffle(opts);
  const box = document.getElementById('quiz-options');
  box.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = o;
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      done++;
      const isCorrect = o === w.m;
      if (isCorrect) { correct++; playCorrect(); } else playWrong();
      checkAndCelebrate(isCorrect);
      updateStats();
      document.querySelectorAll('.option').forEach(b => {
        b.classList.add('disabled');
        if (b.textContent === w.m) b.classList.add('correct');
      });
      if (!isCorrect) btn.classList.add('wrong');
      document.getElementById('quiz-hint').textContent = w.p;
      document.getElementById('quiz-hint').classList.add('show');
      document.getElementById('quiz-next').style.display = 'inline-block';
    };
    box.appendChild(btn);
  });
  updateProgress('quiz-progress');
}
document.getElementById('quiz-next').onclick = () => {
  idx = (idx + 1) % order.length;
  if (idx === 0) toast('Đã hết vòng!');
  renderQuiz();
};
document.getElementById('quiz-shuffle').onclick = () => {
  resetOrder(); renderQuiz(); toast('Đã xáo trộn!');
};

// ===== TYPE =====
function renderType() {
  answered = false;
  const w = VOCAB[order[idx]];
  document.getElementById('type-hanzi').textContent = w.h;
  document.getElementById('type-meaning').textContent = w.m;
  const input = document.getElementById('pinyin-input');
  input.value = '';
  input.classList.remove('correct','wrong');
  input.focus();
  document.getElementById('type-feedback').textContent = '';
  document.getElementById('type-feedback').className = 'feedback';
  updateProgress('type-progress');
}
function checkPinyin() {
  if (answered) return;
  const w = VOCAB[order[idx]];
  const input = document.getElementById('pinyin-input');
  const user = input.value.trim();
  if (!user) return;
  answered = true;
  done++;
  const isCorrect = normalizePinyin(user) === normalizePinyin(w.p);
  if (isCorrect) {
    correct++;
    input.classList.add('correct');
    document.getElementById('type-feedback').textContent = '✓ Chính xác! ' + w.p;
    document.getElementById('type-feedback').className = 'feedback ok';
    playCorrect();
    checkAndCelebrate(true);
  } else {
    input.classList.add('wrong');
    document.getElementById('type-feedback').textContent = '✗ Đáp án: ' + w.p;
    document.getElementById('type-feedback').className = 'feedback err';
    playWrong();
    checkAndCelebrate(false);
  }
  updateStats();
}
document.getElementById('type-check').onclick = checkPinyin;
document.getElementById('pinyin-input').onkeydown = e => {
  if (e.key === 'Enter') {
    if (answered) {
      idx = (idx + 1) % order.length;
      if (idx === 0) toast('Đã hết vòng!');
      renderType();
    } else checkPinyin();
  }
};
document.getElementById('type-skip').onclick = () => {
  idx = (idx + 1) % order.length;
  renderType();
};
document.getElementById('type-shuffle').onclick = () => {
  resetOrder(); renderType(); toast('Đã xáo trộn!');
};
document.querySelectorAll('.tone-btn').forEach(btn => {
  btn.onclick = () => {
    const input = document.getElementById('pinyin-input');
    if (btn.dataset.tone !== '0') input.value += btn.dataset.tone;
    input.focus();
  };
});

// ===== MODE =====
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + mode).classList.add('active');
    if (mode === 'flash') renderFlash();
    else if (mode === 'quiz') renderQuiz();
    else renderType();
  };
});

// ===== INIT =====
document.getElementById('stat-total').textContent = VOCAB.length;
resetOrder();
renderFlash();
document.body.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, {once: true});
</script>
